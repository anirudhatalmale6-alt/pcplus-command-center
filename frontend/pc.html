<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC Diagnostics — PC Plus Command Center</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e17;--surface:#111827;--card:#1a2236;--border:#1e2d4a;
  --text:#e2e8f0;--dim:#64748b;--accent:#3b82f6;--green:#22c55e;
  --red:#ef4444;--amber:#f59e0b;--cyan:#06b6d4;--purple:#a855f7;
  --pink:#ec4899;--orange:#f97316;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
a{color:var(--accent);text-decoration:none}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.topbar .logo{font-weight:700;font-size:15px;color:var(--accent);white-space:nowrap}
.topbar nav{display:flex;gap:8px}
.topbar nav a{padding:6px 14px;border-radius:6px;font-size:13px;color:var(--dim);transition:.2s}
.topbar nav a:hover,.topbar nav a.active{background:var(--accent);color:#fff}
.topbar .hostname-title{margin-left:auto;font-size:14px;color:var(--dim)}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.container{max-width:1600px;margin:0 auto;padding:20px 24px}

.hero{display:flex;align-items:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.hero .status-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.hero .status-dot.online{background:var(--green);box-shadow:0 0 8px var(--green)}
.hero .status-dot.offline{background:var(--red);box-shadow:0 0 8px var(--red)}
.hero h1{font-size:28px;font-weight:700}
.hero .meta{font-size:13px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap}
.hero .meta span{display:flex;align-items:center;gap:4px}

.grid{display:grid;gap:16px;margin-bottom:24px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.grid-3,.grid-2{grid-template-columns:1fr}}
@media(max-width:600px){.grid-4{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;overflow:hidden}
.card h3{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.card h3 .icon{font-size:16px}

.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-row .label{color:var(--dim)}
.stat-row .value{font-weight:600;text-align:right;max-width:60%;word-break:break-all}

.gauge-row{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;padding:8px 0}
.gauge-item{text-align:center}
.gauge-ring{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.gauge-ring .inner{width:64px;height:64px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column}
.gauge-ring .inner .val{font-size:18px;font-weight:700}
.gauge-ring .inner .unit{font-size:9px;color:var(--dim)}
.gauge-label{font-size:11px;color:var(--dim)}

.section-title{font-size:16px;font-weight:700;margin:28px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.section-title .count{font-size:12px;color:var(--dim);font-weight:400}

.proc-table{width:100%;border-collapse:collapse;font-size:12px}
.proc-table th{text-align:left;padding:8px 10px;background:var(--surface);color:var(--dim);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.5px;position:sticky;top:52px;z-index:10}
.proc-table td{padding:7px 10px;border-bottom:1px solid var(--border)}
.proc-table tr:hover td{background:rgba(59,130,246,.05)}
.proc-table .bar-cell{width:120px}
.proc-table .bar{height:6px;border-radius:3px;background:var(--border)}
.proc-table .bar-fill{height:100%;border-radius:3px;transition:width .3s}

.tab-bar{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab-bar button{padding:7px 16px;border:1px solid var(--border);background:transparent;color:var(--dim);border-radius:6px;font-size:12px;cursor:pointer;transition:.2s}
.tab-bar button:hover{border-color:var(--accent);color:var(--text)}
.tab-bar button.active{background:var(--accent);border-color:var(--accent);color:#fff}

.search-box{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-size:13px;width:260px;outline:none;transition:.2s}
.search-box:focus{border-color:var(--accent)}

.disk-bar{height:20px;background:var(--border);border-radius:4px;overflow:hidden;margin:4px 0}
.disk-bar-fill{height:100%;border-radius:4px;transition:width .3s}

.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.sw-item{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:12px}
.sw-item .sw-name{font-weight:600;margin-bottom:2px}
.sw-item .sw-meta{color:var(--dim);font-size:11px}

.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.svc-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:12px}
.svc-item .svc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.svc-item .svc-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc-item .svc-type{color:var(--dim);font-size:10px}

.pcplus-highlight{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(168,85,247,.08));border-color:rgba(59,130,246,.3)}

.refresh-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.refresh-bar button{padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;transition:.2s}
.refresh-bar button:hover{opacity:.85}
.refresh-bar button:disabled{opacity:.4;cursor:not-allowed}
.refresh-bar .timestamp{font-size:11px;color:var(--dim)}

.net-card{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.net-card .net-icon{font-size:20px;color:var(--cyan)}
.net-card .net-info{flex:1;font-size:12px}
.net-card .net-info .net-name{font-weight:600;margin-bottom:2px}
.net-card .net-info .net-mac{color:var(--dim);font-size:11px}

.empty-state{text-align:center;padding:40px 20px;color:var(--dim);font-size:14px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">PC PLUS COMMAND CENTER</div>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/benchmark.html">Server</a>
    <a href="/fleet.html">Fleet</a>
    <a class="active">PC Detail</a>
  </nav>
  <div class="hostname-title" id="navHostname"></div>
</div>

<div id="loadingState" class="loading">
  <div class="spinner"></div>
  <div style="color:var(--dim);font-size:14px">Loading PC diagnostics...</div>
</div>

<div id="mainContent" class="container" style="display:none">

  <div class="hero" id="heroSection"></div>

  <div class="refresh-bar">
    <button onclick="loadData()" id="refreshBtn">Refresh Data</button>
    <span class="timestamp" id="refreshTime"></span>
  </div>

  <!-- System Overview Gauges -->
  <div id="gaugesSection" class="card" style="margin-bottom:24px"></div>

  <!-- Hardware & Identity -->
  <div class="grid grid-4" id="infoCards"></div>

  <!-- Disk Health -->
  <div class="section-title">Disk Health <span class="count" id="diskCount"></span></div>
  <div class="grid grid-3" id="diskSection"></div>

  <!-- Network Adapters -->
  <div class="section-title">Network Adapters <span class="count" id="netCount"></span></div>
  <div class="grid grid-2" id="netSection"></div>

  <!-- PCPlus Impact -->
  <div class="section-title">PC Plus Computing Impact</div>
  <div id="pcplusSection"></div>

  <!-- Processes -->
  <div class="section-title">Processes <span class="count" id="procCount"></span></div>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
    <div class="tab-bar" id="procTabs">
      <button class="active" onclick="switchProcTab('memory')">Top by Memory</button>
      <button onclick="switchProcTab('cpu')">Top by CPU</button>
      <button onclick="switchProcTab('all')">All PCPlus</button>
    </div>
    <input type="text" class="search-box" placeholder="Filter processes..." id="procSearch" oninput="filterProcs()">
  </div>
  <div class="card" style="max-height:500px;overflow-y:auto;padding:0">
    <table class="proc-table" id="procTable">
      <thead><tr><th>Name</th><th>PID</th><th>User</th><th style="text-align:right">Memory (MB)</th><th class="bar-cell">Memory</th><th style="text-align:right">CPU %</th><th class="bar-cell">CPU</th></tr></thead>
      <tbody id="procBody"></tbody>
    </table>
  </div>

  <!-- Services -->
  <div class="section-title">Running Services <span class="count" id="svcCount"></span></div>
  <div style="margin-bottom:12px">
    <input type="text" class="search-box" placeholder="Filter services..." id="svcSearch" oninput="filterServices()">
  </div>
  <div class="svc-grid" id="svcSection"></div>

  <!-- Installed Software -->
  <div class="section-title">Installed Software <span class="count" id="swCount"></span></div>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
    <input type="text" class="search-box" placeholder="Filter software..." id="swSearch" oninput="filterSoftware()">
  </div>
  <div class="sw-grid" id="swSection"></div>

</div>

<script>
let DATA = null;
let currentProcTab = 'memory';

const params = new URLSearchParams(location.search);
const agentId = params.get('id');

if (!agentId) {
  document.getElementById('loadingState').innerHTML = '<div class="empty-state">No agent ID specified. Go to <a href="/fleet.html">Fleet</a> to select a PC.</div>';
} else {
  loadData();
}

async function loadData() {
  const btn = document.getElementById('refreshBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading...'; }
  try {
    const resp = await fetch('/api/agent/' + encodeURIComponent(agentId) + '/detail');
    if (!resp.ok) throw new Error('API error ' + resp.status);
    DATA = await resp.json();
    render();
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    document.getElementById('refreshTime').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('loadingState').innerHTML = '<div class="empty-state">Failed to load: ' + e.message + '<br><a href="/fleet.html">Back to Fleet</a></div>';
  }
  if (btn) { btn.disabled = false; btn.textContent = 'Refresh Data'; }
}

function gaugeColor(pct) {
  if (pct < 50) return 'var(--green)';
  if (pct < 80) return 'var(--amber)';
  return 'var(--red)';
}

function makeGauge(label, value, max, unit, color) {
  const pct = max > 0 ? Math.min((value / max) * 100, 100) : 0;
  const c = color || gaugeColor(pct);
  const deg = (pct / 100) * 360;
  return `<div class="gauge-item">
    <div class="gauge-ring" style="background:conic-gradient(${c} 0deg ${deg}deg, var(--border) ${deg}deg 360deg)">
      <div class="inner"><span class="val" style="color:${c}">${typeof value === 'number' ? (value > 100 ? Math.round(value) : value.toFixed(1)) : value}</span><span class="unit">${unit}</span></div>
    </div>
    <div class="gauge-label">${label}</div>
  </div>`;
}

function render() {
  const d = DATA;
  const isOnline = d.status === 'online';

  document.title = d.hostname + ' — PC Diagnostics';
  document.getElementById('navHostname').textContent = d.hostname;

  // Hero
  document.getElementById('heroSection').innerHTML = `
    <div class="status-dot ${isOnline ? 'online' : 'offline'}"></div>
    <h1>${esc(d.hostname)}</h1>
    <div class="meta">
      <span>${esc(d.operating_system)}</span>
      <span>${esc(d.site)} / ${esc(d.client)}</span>
      <span>Agent: ${esc(d.agent_id.substring(0, 12))}...</span>
      ${d.logged_user ? `<span>Logged in: ${esc(d.logged_user)}</span>` : ''}
    </div>`;

  // Gauges
  const totalRam = d.total_ram || 1;
  const procMem = d.process_summary.total_mem_mb;
  const memPct = Math.min((procMem / (totalRam * 1024)) * 100, 100);
  const cpuPct = Math.min(d.process_summary.total_cpu_pct, 100);

  let diskPct = 0;
  if (d.disks && d.disks.length > 0) {
    const mainDisk = d.disks.find(dk => dk.device === 'C:') || d.disks[0];
    diskPct = mainDisk.percent || 0;
  }

  document.getElementById('gaugesSection').innerHTML = `
    <h3><span class="icon">&#x1F4CA;</span> System Overview</h3>
    <div class="gauge-row">
      ${makeGauge('Process Memory', procMem > 1024 ? (procMem/1024).toFixed(1) : procMem.toFixed(0), 1, procMem > 1024 ? 'GB' : 'MB')}
      ${makeGauge('CPU Usage', cpuPct, 100, '%')}
      ${makeGauge('Disk (Main)', diskPct, 100, '%')}
      ${makeGauge('Processes', d.process_summary.total, 1, 'total', 'var(--cyan)')}
      ${makeGauge('Uptime', d.uptime_hours > 24 ? (d.uptime_hours/24).toFixed(1) : d.uptime_hours.toFixed(1), 1, d.uptime_hours > 24 ? 'days' : 'hrs', 'var(--purple)')}
      ${makeGauge('Services', d.services_summary.running, 1, 'running', 'var(--cyan)')}
    </div>`;

  // Info Cards
  const cards = [
    { title: 'Hardware', icon: '&#x1F5A5;', rows: [
      ['CPU', d.cpu_model],
      ['RAM', d.total_ram + ' GB'],
      ['Make/Model', d.make_model || 'N/A'],
      ['Graphics', d.graphics || 'N/A'],
      ['Serial', d.serial_number || 'N/A'],
    ]},
    { title: 'Operating System', icon: '&#x1F4BB;', rows: [
      ['OS', d.os_detail.name || d.operating_system],
      ['Version', d.os_detail.version || 'N/A'],
      ['Build', d.os_detail.build || 'N/A'],
      ['Architecture', d.os_detail.arch || 'N/A'],
      ['Install Date', formatDate(d.os_detail.install_date)],
      ['Last Boot', formatDate(d.os_detail.last_boot || d.boot_time)],
    ]},
    { title: 'Identity', icon: '&#x1F464;', rows: [
      ['Hostname', d.hostname],
      ['Agent Version', d.version],
      ['Site', d.site],
      ['Client', d.client],
      ['Logged User', d.logged_user || 'None'],
      ['Last Logged User', d.last_logged_user || 'N/A'],
      ['Registered User', d.os_detail.registered_user || 'N/A'],
    ]},
    { title: 'Network', icon: '&#x1F310;', rows: [
      ['Public IP', d.public_ip || 'N/A'],
      ['Local IPs', d.local_ips || 'N/A'],
      ['Last Seen', formatDate(d.last_seen)],
      ['Needs Reboot', d.needs_reboot ? 'YES' : 'No'],
    ]},
  ];

  if (d.bios && (d.bios.manufacturer || d.bios.serial)) {
    cards.push({ title: 'BIOS', icon: '&#x2699;', rows: [
      ['Manufacturer', d.bios.manufacturer || 'N/A'],
      ['Version', d.bios.version || 'N/A'],
      ['Serial', d.bios.serial || 'N/A'],
    ]});
  }

  document.getElementById('infoCards').innerHTML = cards.map(c =>
    `<div class="card"><h3><span class="icon">${c.icon}</span> ${c.title}</h3>` +
    c.rows.map(r => `<div class="stat-row"><span class="label">${r[0]}</span><span class="value">${esc(String(r[1] || 'N/A'))}</span></div>`).join('') +
    '</div>'
  ).join('');

  // Disks
  const disks = d.disks || [];
  document.getElementById('diskCount').textContent = disks.length + ' drives';
  document.getElementById('diskSection').innerHTML = disks.length === 0 ?
    '<div class="empty-state">No disk data</div>' :
    disks.map(dk => {
      const pct = dk.percent || 0;
      const color = gaugeColor(pct);
      return `<div class="card">
        <h3>${esc(dk.device)}</h3>
        <div class="disk-bar"><div class="disk-bar-fill" style="width:${pct}%;background:${color}"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:4px">
          <span style="color:var(--dim)">Used: ${esc(dk.used)}</span>
          <span style="font-weight:600;color:${color}">${pct}%</span>
          <span style="color:var(--dim)">Free: ${esc(dk.free)}</span>
        </div>
        <div style="text-align:center;font-size:11px;color:var(--dim);margin-top:4px">Total: ${esc(dk.total)}</div>
      </div>`;
    }).join('');

  // Network Adapters
  const nets = d.network_adapters || [];
  document.getElementById('netCount').textContent = nets.length + ' active';
  document.getElementById('netSection').innerHTML = nets.length === 0 ?
    '<div class="empty-state">No active network adapters found</div>' :
    nets.map(n => `<div class="net-card">
      <div class="net-icon">&#x1F4F6;</div>
      <div class="net-info">
        <div class="net-name">${esc(n.name)}</div>
        <div class="net-mac">${esc(n.mac || 'N/A')} | ${esc(n.type || '')} | Speed: ${esc(n.speed || 'N/A')}</div>
      </div>
    </div>`).join('');

  // PCPlus Impact
  const pp = d.pcplus_processes || [];
  const ppCard = pp.length === 0 ?
    '<div class="card"><div class="empty-state">No PC Plus processes found on this machine</div></div>' :
    `<div class="card pcplus-highlight">
      <h3><span class="icon">&#x1F6E1;</span> PC Plus Computing Processes</h3>
      <div class="gauge-row">
        ${makeGauge('Memory', d.pcplus_total_mem_mb, 1, 'MB', 'var(--accent)')}
        ${makeGauge('CPU', d.pcplus_total_cpu_pct, 100, '%', 'var(--purple)')}
        ${makeGauge('Count', pp.length, 1, 'procs', 'var(--cyan)')}
      </div>
      <table class="proc-table" style="margin-top:12px">
        <thead><tr><th>Process</th><th>PID</th><th>User</th><th style="text-align:right">Memory (MB)</th><th style="text-align:right">CPU %</th></tr></thead>
        <tbody>${pp.map(p => `<tr>
          <td style="font-weight:600;color:var(--accent)">${esc(p.name)}</td>
          <td style="color:var(--dim)">${p.pid}</td>
          <td style="color:var(--dim)">${esc(p.user)}</td>
          <td style="text-align:right">${p.mem_mb}</td>
          <td style="text-align:right">${p.cpu_pct.toFixed(1)}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`;
  document.getElementById('pcplusSection').innerHTML = ppCard;

  // Processes
  document.getElementById('procCount').textContent = d.process_summary.total + ' total';
  renderProcTable();

  // Services
  const svcs = d.running_services || [];
  document.getElementById('svcCount').textContent = `${d.services_summary.running} running / ${d.services_summary.total} total (${d.services_summary.auto_start} auto-start)`;
  renderServices(svcs);

  // Software
  const sw = d.installed_software || [];
  document.getElementById('swCount').textContent = d.software_count + ' installed';
  renderSoftware(sw);
}

function renderProcTable() {
  let procs;
  if (currentProcTab === 'memory') procs = DATA.top_by_memory || [];
  else if (currentProcTab === 'cpu') procs = DATA.top_by_cpu || [];
  else procs = DATA.pcplus_processes || [];

  const q = (document.getElementById('procSearch').value || '').toLowerCase();
  if (q) procs = procs.filter(p => p.name.toLowerCase().includes(q) || (p.user || '').toLowerCase().includes(q));

  const maxMem = Math.max(...procs.map(p => p.mem_mb), 1);
  const maxCpu = Math.max(...procs.map(p => p.cpu_pct), 1);

  document.getElementById('procBody').innerHTML = procs.map(p => {
    const memW = (p.mem_mb / maxMem * 100).toFixed(1);
    const cpuW = (p.cpu_pct / maxCpu * 100).toFixed(1);
    const isPcplus = p.name.toLowerCase().includes('pcplus');
    return `<tr${isPcplus ? ' style="background:rgba(59,130,246,.06)"' : ''}>
      <td${isPcplus ? ' style="color:var(--accent);font-weight:600"' : ''}>${esc(p.name)}</td>
      <td style="color:var(--dim)">${p.pid || ''}</td>
      <td style="color:var(--dim)">${esc(p.user || '')}</td>
      <td style="text-align:right">${p.mem_mb}</td>
      <td class="bar-cell"><div class="bar"><div class="bar-fill" style="width:${memW}%;background:var(--accent)"></div></div></td>
      <td style="text-align:right">${p.cpu_pct.toFixed(1)}</td>
      <td class="bar-cell"><div class="bar"><div class="bar-fill" style="width:${cpuW}%;background:var(--amber)"></div></div></td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--dim)">No processes</td></tr>';
}

function switchProcTab(tab) {
  currentProcTab = tab;
  document.querySelectorAll('#procTabs button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderProcTable();
}

function filterProcs() { renderProcTable(); }

function renderServices(svcs) {
  const q = (document.getElementById('svcSearch').value || '').toLowerCase();
  const filtered = q ? svcs.filter(s => s.name.toLowerCase().includes(q) || s.svc_name.toLowerCase().includes(q)) : svcs;
  document.getElementById('svcSection').innerHTML = filtered.map(s => {
    const isPcplus = (s.name + s.svc_name).toLowerCase().includes('pcplus') || (s.name + s.svc_name).toLowerCase().includes('tacticalrmm');
    return `<div class="svc-item${isPcplus ? ' pcplus-highlight' : ''}">
      <div class="svc-dot" style="background:var(--green)"></div>
      <div class="svc-name" title="${esc(s.svc_name)}">${esc(s.name)}</div>
      <div class="svc-type">${esc(s.start_type)}</div>
    </div>`;
  }).join('') || '<div class="empty-state">No services match</div>';
}

function filterServices() {
  renderServices(DATA.running_services || []);
}

function renderSoftware(sw) {
  const q = (document.getElementById('swSearch').value || '').toLowerCase();
  const filtered = q ? sw.filter(s => s.name.toLowerCase().includes(q) || (s.publisher || '').toLowerCase().includes(q)) : sw;
  document.getElementById('swSection').innerHTML = filtered.map(s =>
    `<div class="sw-item">
      <div class="sw-name">${esc(s.name)}</div>
      <div class="sw-meta">${esc(s.version || 'N/A')} | ${esc(s.publisher || 'Unknown')}</div>
    </div>`
  ).join('') || '<div class="empty-state">No software match</div>';
}

function filterSoftware() {
  renderSoftware(DATA.installed_software || []);
}

function formatDate(d) {
  if (!d) return 'N/A';
  try {
    const dt = new Date(d);
    if (isNaN(dt)) return String(d).substring(0, 19);
    return dt.toLocaleString();
  } catch { return String(d).substring(0, 19); }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
